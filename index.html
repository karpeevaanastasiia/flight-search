<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Flight-search</title>
</head>
<body>
    <header class="header-container">
        <h1>Flight-search</h1>
    </header>
    <section class="main-section">
        <div class="filter">
            <div class="filter-container">
                <ul class="filter-list">
                    <li class="filter-item">
                        <label>
                        <input type="checkbox" name="option0" value="0">
                        Все
                        </label>
                    </li>
                    <li class="filter-item">
                    <label>
                        <input type="checkbox" name="option1" value="1">
                        Без пересадок
                    </label>
                    </li>
                    <li class="filter-item">
                    <label>
                        <input type="checkbox" name="option2" value="2">
                        1 пересадка
                    </label>
                    </li>
                    <li class="filter-item">
                    <label>
                        <input type="checkbox" name="option3" value="3">
                        2 пересадки
                    </label>
                    </li>
                    <li class="filter-item">
                        <label>
                        <input type="checkbox" name="option4" value="4">
                            Больше 2 пересадок
                        </label>
                    </li>
                </ul>
            </div>
        </div>
        <div class="select">
            <div class="button-box">
                <button class="select-button-item button-cheaper">Самый дешевый</button>
                <button class="select-button-item button-faster">Самый быстрый</button>
            </div>
        </div>
    </section>
</body>
</html>
